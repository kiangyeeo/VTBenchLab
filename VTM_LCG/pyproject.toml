[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtm-lcg"
version = "0.1.0"
description = "Phase 0 tooling for Visual Token Modelability and Language-Conditioned Gain."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "Pillow>=11",
  "PyYAML>=6",
  "safetensors>=0.4",
  "timm>=1.0",
  "torch>=2.4",
  "torchvision>=0.19",
  "tqdm>=4.66",
  "transformers>=4.46,<5",
]

[tool.setuptools.packages.find]
include = ["vtm_lcg*"]

