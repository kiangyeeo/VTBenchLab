schema_version: 1

phase0_summaries:
  train: artifacts/coco_karpathy_full/phase0/train/summary.json
  validation: artifacts/coco_karpathy_full/phase0/validation/summary.json
  test: artifacts/coco_karpathy_full/phase0/test/summary.json

artifact_root: artifacts/coco_karpathy_full/phase1

expected_counts:
  train: 82783
  validation: 5000
  test: 5000

text:
  checkpoint: ../TokBench/tokenizer_modelzoo/continuous/clip_openai__l14
  max_length: 77
  mode: online_frozen

predictor:
  visual_input_dim: 1024
  text_input_dim: 768
  model_dim: 256
  depth: 4
  num_heads: 8
  mlp_ratio: 4
  dropout: 0.0
  mask_ratio: 0.5
  caption_dropout: 0.5
  position_embedding: fixed_2d_sincos

training:
  epochs: 20
  batch_size: 32
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 0.05
  warmup_ratio: 0.05
  precision: bfloat16
  seeds: [0]
  verify_checksums_first_epoch: true

evaluation:
  batch_size: 32
  caption_mode: first
  mask_seed: 10000
  caption_seed: 20000
  shuffle_seed: 30000

