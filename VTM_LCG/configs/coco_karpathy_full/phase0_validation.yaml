schema_version: 1

dataset:
  annotations: ../data/clip_benchmark/mscoco_captions/coco_val_karpathy.json
  image_root: ../data/gvt/raw/coco/val2014
  limit: null

runtime:
  artifact_root: artifacts/coco_karpathy_full/phase0/validation
  device: cuda
  backbone_dtype: bfloat16
  feature_dtype: float16
  batch_size: 32
  shard_size: 32
  num_workers: 8
  stats_epsilon: 1.0e-6

preprocess:
  input_size: 224
  resize_size: 224
  interpolation: bicubic
  mean: [0.48145466, 0.4578275, 0.40821073]
  std: [0.26862954, 0.26130258, 0.27577711]

cross_view:
  horizontal_flip: true
  brightness_delta: 0.1
  contrast_delta: 0.1
  saturation_delta: 0.1

tokenizers:
  - id: clip_openai__l14
    adapter: openai_clip
    checkpoint: ../TokBench/tokenizer_modelzoo/continuous/clip_openai__l14
    expected_grid: [16, 16]
    expected_hidden_dim: 1024
    surface: final post-LayerNorm patch tokens before the OpenAI CLIP visual projection

  - id: mc1_l14_224_2.5b
    adapter: metaclip
    checkpoint: ../TokBench/tokenizer_modelzoo/continuous/mc1_l14_224_2.5b/model.safetensors
    model_name: vit_large_patch14_clip_224.metaclip_2pt5b
    expected_grid: [16, 16]
    expected_hidden_dim: 1024
    surface: final normalized patch tokens before the MetaCLIP visual projection

  - id: siglip2_l16_256
    adapter: siglip2
    checkpoint: ../TokBench/tokenizer_modelzoo/continuous/siglip2_l16_256
    model_name: vit_large_patch16_siglip_256
    expected_grid: [16, 16]
    expected_hidden_dim: 1024
    surface: final normalized patch tokens before SigLIP2 attention pooling
    preprocess:
      input_size: 256
      resize_size: 284
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]

  - id: mc2_l14_224
    adapter: metaclip2
    checkpoint: ../TokBench/tokenizer_modelzoo/continuous/mc2_l14_224/metaclip2_l14_224px_worldwide.pt
    depth: 24
    projection_dim: 768
    expected_grid: [16, 16]
    expected_hidden_dim: 1024
    surface: final normalized patch tokens before the MetaCLIP 2 visual projection
