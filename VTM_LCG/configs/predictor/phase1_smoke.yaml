schema_version: 1

phase0_summary: artifacts/phase0_smoke/summary.json
artifact_root: artifacts/phase1_smoke

split:
  seed: 0
  train: 800
  validation: 100
  test: 100

text:
  checkpoint: ../TokBench/tokenizer_modelzoo/continuous/clip_openai__l14
  max_length: 77
  encode_batch_size: 128
  cache_dtype: float16

predictor:
  visual_input_dim: 1024
  text_input_dim: 768
  model_dim: 256
  depth: 4
  num_heads: 8
  mlp_ratio: 4
  dropout: 0.0
  mask_ratio: 0.5
  caption_dropout: 0.5
  position_embedding: fixed_2d_sincos

training:
  epochs: 20
  batch_size: 32
  num_workers: 0
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 0.05
  warmup_ratio: 0.05
  precision: bfloat16
  stats_epsilon: 1.0e-6
  seeds: [0]

evaluation:
  batch_size: 32
  mask_seed: 10000
  caption_seed: 20000
  shuffle_seed: 30000

